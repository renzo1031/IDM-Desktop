<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">IDM Desktop Logo</title>
  <desc id="desc">A blue gradient rounded square download logo for IDM Desktop.</desc>
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#3A7BD5"/>
      <stop offset="100%" stop-color="#004E92"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3A7BD5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="160" height="160" rx="32" fill="url(#mainGrad)" filter="url(#shadow)"/>

  <g fill="#FFFFFF">
    <rect x="88" y="42" width="24" height="65" rx="4"/>
    <polygon points="65,87 100,127 135,87"/>
    <rect x="65" y="127" width="70" height="10" rx="5"/>
  </g>
</svg>
